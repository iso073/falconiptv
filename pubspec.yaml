name: falconiptv
description: "Google TV ve Android TV için Falcon IPTV istemcisi."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  video_player: ^2.14.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Used by tool/generate_launcher_assets.dart to render launcher icons.
  image: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/falcon_logo.png
